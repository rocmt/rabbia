<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How many times was Rossana late?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Caveat:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e7; --card:#fffdf8; --ink:#1d1b18; --muted:#7a7268; --line:#e3dccf;
    --accent:#a21caf; --owner-accent:#c2410c; --guest:#1f5fa8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#16150f; --card:#201e18; --ink:#efe9dd; --muted:#9b9285; --line:#36322a;
      --accent:#e879f9; --owner-accent:#fb923c; --guest:#8cb8ee; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px 80px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:28px}
  a.home{color:var(--muted);text-decoration:none;font-size:20px}
  .who{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
  .who input{width:140px}
  .badge{background:var(--owner-accent);color:#fff;border-radius:999px;padding:2px 10px;font-weight:600;font-size:12px}
  input,button{font:inherit;color:inherit}
  input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px}
  button.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline}
  h1{font-family:Fraunces,serif;font-size:30px;line-height:1.15;text-align:center;margin:0 0 8px;letter-spacing:-.3px}
  .hero{text-align:center;margin-bottom:28px}
  .count{font-family:Fraunces,serif;font-weight:700;font-size:min(34vw,150px);line-height:1;color:var(--accent);margin:8px 0 4px}
  .label{color:var(--muted)}
  .label b{color:var(--ink);font-weight:600}
  form{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  #minutes{width:110px}
  #comment{flex:1;min-width:200px}
  #lateBtn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;width:100%}
  #lateBtn:disabled{opacity:.6}
  .hint{width:100%;text-align:center;font-size:12px;color:var(--muted)}
  .err{color:#b91c1c;font-size:13px;min-height:20px;text-align:center;margin:8px 0}
  h2{font-family:Fraunces,serif;font-size:20px;margin:28px 0 8px}
  ul{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:62px 62px 1fr auto;gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  li.empty{display:block;color:var(--muted);text-align:center;border:0}
  .date{font-size:12px;color:var(--muted)}
  .min{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
  .body{min-width:0;overflow-wrap:anywhere}
  .cmt{margin-right:6px}
  li.g .cmt{font-family:Caveat,cursive;font-size:21px;line-height:1.1;color:var(--guest)}
  li.o .cmt{font-family:Fraunces,serif;font-style:italic}
  li .by{font-size:12px;color:var(--muted);white-space:nowrap}
  .x{border:0;background:none;color:var(--muted);padding:0 4px;font-size:16px}
  .x:hover{color:var(--owner-accent)}
  @media (max-width:480px){ li{grid-template-columns:52px 54px 1fr auto} }
</style>
</head>
<body data-space="late">
<div class="wrap">
  <header>
    <a href="./" class="home" title="Home">←</a>
    <div class="who" id="who"></div>
  </header>

  <div class="hero">
    <h1>How many times was Rossana late?</h1>
    <div class="count" id="count">…</div>
    <div class="label"><span id="countLabel">times late</span> · <b id="total">0 min</b> of everyone's life<span id="unknown"></span></div>
  </div>

  <form id="lateForm">
    <input id="minutes" type="number" min="1" max="1440" inputmode="numeric" placeholder="minutes">
    <input id="comment" maxlength="280" placeholder="She said she was on the bus. She was in pyjamas">
    <button id="lateBtn">She's late again</button>
    <div class="hint">Minutes and comment are optional.</div>
  </form>
  <div class="err" id="err"></div>

  <h2>Excuse log</h2>
  <ul id="log"><li class="empty">Loading…</li></ul>
</div>
<script type="module" src="apps.js?v=4"></script>
</body>
</html>

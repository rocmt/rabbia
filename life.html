<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tally · Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Caveat:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e7; --card:#fffdf8; --ink:#1d1b18; --muted:#7a7268; --line:#e3dccf;
    --owner:#1d1b18; --owner-accent:#c2410c;
    --guest:#1f5fa8; --guest-bg:#eef4fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#16150f; --card:#201e18; --ink:#efe9dd; --muted:#9b9285; --line:#36322a;
      --owner:#efe9dd; --owner-accent:#fb923c;
      --guest:#8cb8ee; --guest-bg:#1b2533;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 16px 80px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  h1{font-family:Fraunces,serif;font-size:38px;margin:0;letter-spacing:-.5px}
  .who{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
  .who input{width:140px}
  .badge{background:var(--owner-accent);color:#fff;border-radius:999px;padding:2px 10px;font-weight:600;font-size:12px}
  input,select,button{font:inherit;color:inherit}
  input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
  button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  button.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline}
  .add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .add input{flex:1;min-width:200px}
  .legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:14px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .legend .lo::before{background:var(--owner-accent)} .legend .lg::before{background:var(--guest)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
  .card.owner{border-top:4px solid var(--owner-accent)}
  .card.guest{background:var(--guest-bg);border:1.5px dashed var(--guest)}
  .card h2{margin:0 26px 4px 0;font-size:19px;line-height:1.25}
  .owner h2{font-family:Fraunces,serif;color:var(--owner)}
  .guest h2,.guest .by{font-family:Caveat,cursive;color:var(--guest);font-size:24px;font-weight:700}
  .by{font-size:12px;color:var(--muted)}
  .guest .by{font-size:18px;font-weight:500}
  .del{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--muted);font-size:18px;padding:2px 6px}
  .del:hover{color:var(--owner-accent)}
  .count{font-family:Fraunces,serif;font-size:56px;font-weight:700;line-height:1;margin:12px 0}
  .guest .count{font-family:Caveat,cursive;color:var(--guest);font-size:68px}
  .row{display:flex;gap:8px}
  .tick{flex:1;font-weight:600}
  ul{list-style:none;margin:10px 0;padding:0}
  li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
  li label{flex:1;display:flex;gap:8px;align-items:flex-start}
  li input[type=checkbox]{margin-top:4px}
  li.done .t{text-decoration:line-through;color:var(--muted)}
  li.tg .t{font-family:Caveat,cursive;color:var(--guest);font-size:20px;line-height:1.1}
  li.to .t{font-weight:600}
  li .mini{font-size:12px;color:var(--muted)}
  li .x{border:0;background:none;color:var(--muted);padding:0 4px}
  .addtask{display:flex;gap:6px}
  .addtask input{flex:1;min-width:0}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .err{color:#b91c1c;font-size:13px;min-height:18px}
  h1 a.home{color:inherit;text-decoration:none;opacity:.45}
  footer{margin-top:40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body data-space="life">
<div class="wrap">
  <header>
    <h1><a href="./" class="home">Tally</a> · Life</h1>
    <div class="who" id="who"></div>
  </header>

  <form class="add" id="addForm">
    <input id="newTitle" maxlength="140" placeholder="e.g. Times Rossana was late" required>
    <select id="newType">
      <option value="counter">Counter</option>
      <option value="list">To-do list</option>
    </select>
    <button class="primary">Add</button>
  </form>

  <div class="legend"><span class="lo">by Rossana</span><span class="lg">by everyone else</span></div>
  <div class="err" id="err"></div>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>

  <footer id="foot"></footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
